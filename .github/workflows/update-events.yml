name: Update events calendar snapshot

on:
  schedule:
    # Every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch latest calendar feed
        run: |
          # Strip DTSTAMP lines (they change on every fetch even when no
          # events changed) so we only commit when the actual schedule differs.
          curl -fsSL "https://api.scouting.org/advancements/events/calendar/19132" \
            | grep -v '^DTSTAMP' > events.ics

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add events.ics
          git diff --cached --quiet || git commit -m "chore: refresh events calendar snapshot"
          git push
